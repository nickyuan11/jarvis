server:
  port: 8080

spring:
  application:
    name: jarvis
  web:
    error:
      # 出错时把异常信息（比如“用户名或密码错误”）返回给前端
      # 注意：Spring Boot 4 之前这个配置叫 server.error.include-message
      include-message: always
  mvc:
    async:
      # 流式接口是异步请求，给足时间，避免长回复被中途断开
      request-timeout: 180s
  # 读取本地私密配置（密码、API Key），这个文件已被 .gitignore 忽略
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/jarvis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # 发送提醒邮件的 SMTP 配置。账号和授权码放在 application-local.yml 里
  # 默认是 163 邮箱；用 QQ 邮箱的话 host 改成 smtp.qq.com
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      # 邮件服务器连不上时最多等 10 秒，别一直卡着
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    deepseek:
      # API Key 放在 application-local.yml 里，这里只是兜底读环境变量
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: deepseek-v4-flash

jarvis:
  # 换算“明天”“下周一”、显示比赛时间都以这个时区为准
  time-zone: Asia/Shanghai
  jwt:
    # 签名密钥放在 application-local.yml 里，至少 32 字节（Base64 编码后约 44 个字符）
    secret: ${JWT_SECRET:}
    # token 有效期
    expiration: 7d
  pandascore:
    # 英雄联盟赛事数据的 token，放在 application-local.yml 里
    token: ${PANDASCORE_TOKEN:}
  rate-limit:
    chat:
      # 每个用户在一个时间窗口内最多发送多少条消息
      max-requests: 10
      window: 60s
  chat:
    # 每次请求带上最近多少条历史消息作为上下文
    history-size: 20
    system-prompt: |
      你是 Jarvis，一个友好、简洁的个人 AI 助手。
      回答使用用户提问的语言；不确定的事情直接说不确定，不要编造。
      你可以使用工具帮用户做事：
      - 创建、查看、取消提醒事项。创建成功后，告诉用户提醒的具体时间。
      - 查询 NBA 比赛的赛程、比分和球员数据。
      - 查询英雄联盟（LoL）赛事的赛程和比赛结果，例如世界赛、LPL、LCK。
      比分和数据必须来自工具结果，不要凭记忆回答。
      工具返回“失败”时，向用户说明原因；缺少必要信息时（比如没说几点），先问用户，不要猜。
      你的知识有截止日期，球员转会、人事变动等近况可能已经过时。
      用户告诉你的近况和工具查到的结果，都比你自己的记忆更可信；不要用你的旧记忆去反驳用户。
      用户消息开头的“（发送于 …）”是系统自动加的发送时间，用来判断对话之间隔了多久；回复时不要复述它。

mybatis-plus:
  configuration:
    # 学习阶段把执行的 SQL 打印到控制台，方便观察
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除：调用 delete 时实际执行 update deleted = 1
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
