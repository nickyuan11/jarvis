server:
  port: 8080

spring:
  application:
    name: jarvis
  web:
    error:
      # 出错时把异常信息（比如“用户名或密码错误”）返回给前端
      # 注意：Spring Boot 4 之前这个配置叫 server.error.include-message
      include-message: always
  mvc:
    async:
      # 流式接口是异步请求，给足时间，避免长回复被中途断开
      request-timeout: 180s
  flyway:
    # 迁移脚本在 classpath:db/migration（默认位置），只作用于主数据源 MySQL；
    # PostgreSQL 的向量表仍由 Docker 第一次启动时执行 db/vector/schema.sql 创建
    #
    # 接入 Flyway 时库里已经有表了（之前手动执行过 V2～V5），但还没有 Flyway 的历史表 flyway_schema_history。
    # 这种情况 Flyway 默认拒绝启动：它不知道哪些脚本执行过，宁可不做也不乱猜。
    # baseline：告诉它“现在已经是第 5 版”，它在历史表里记一笔，之后只执行 V6 及以后的脚本。
    # 全新的空库不受影响，照常从 V5__baseline_schema.sql 开始执行
    baseline-on-migrate: true
    baseline-version: 5
  servlet:
    multipart:
      # 上传大小的“外层”限制。业务上限是 1 MB（KnowledgeService 里检查，能返回清楚的提示），
      # 这里放宽到 2 MB，只是为了挡住特别大的请求，不让它们进到业务代码
      max-file-size: 2MB
      max-request-size: 2MB
  # 读取本地私密配置（密码、API Key），这个文件已被 .gitignore 忽略
  config:
    import: optional:classpath:application-local.yml
  datasource:
    # 默认连 Docker 里的 MySQL（compose.yaml 映射到本机 3307）。
    # 主机和端口可以用环境变量覆盖，以后应用也放进 Docker 时，DB_HOST 改成服务名 mysql 即可
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/jarvis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:jarvis}
    password: ${DB_PASSWORD:}
  # 发送提醒邮件的 SMTP 配置。账号和授权码放在 application-local.yml 里
  # 默认是 163 邮箱；用 QQ 邮箱的话 host 改成 smtp.qq.com
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      # 邮件服务器连不上时最多等 10 秒，别一直卡着
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    retry:
      # Spring AI 调用模型失败时的自动重试。默认最多 10 次、间隔逐渐拉长，全部试完可能要十几分钟，
      # 比资料处理的租约（10 分钟）还长。这里只做几次快速重试，更长间隔的重试交给 DocumentProcessor
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
    model:
      # 同时引入了 DeepSeek 和 OpenAI 两个模型模块，这里指定每种能力用哪一家
      chat: deepseek          # 对话：DeepSeek
      embedding: openai       # 向量化：OpenAI 兼容接口（实际连的是阿里云百炼）
      # OpenAI 模块还带着画图、语音、内容审核，用不到，全部关掉
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      # 这里的 openai 只是借用 OpenAI 的接口格式，地址和 Key 都是百炼的
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 百炼的 API Key 放在 application-local.yml 里
      api-key: ${EMBEDDING_API_KEY:}
      embedding:
        # 换模型时，所有资料都要重新向量化（不同模型的向量互不兼容），维度也要和 jarvis.vector.dimensions 一致
        model: qwen3.7-text-embedding
    deepseek:
      # API Key 放在 application-local.yml 里，这里只是兜底读环境变量
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: deepseek-v4-flash

jarvis:
  # 换算“明天”“下周一”、显示比赛时间都以这个时区为准
  time-zone: Asia/Shanghai
  jwt:
    # 签名密钥放在 application-local.yml 里，至少 32 字节（Base64 编码后约 44 个字符）
    secret: ${JWT_SECRET:}
    # token 有效期
    expiration: 7d
  pandascore:
    # 英雄联盟赛事数据的 token，放在 application-local.yml 里
    token: ${PANDASCORE_TOKEN:}
  vector:
    # 向量库（PostgreSQL + pgvector）的数据源。业务数据仍在 MySQL（spring.datasource）
    datasource:
      url: jdbc:postgresql://${VECTOR_DB_HOST:localhost}:${VECTOR_DB_PORT:5432}/jarvis_vector
      username: ${VECTOR_DB_USERNAME:jarvis}
      # 密码放在 application-local.yml 里，和 .env 的 POSTGRES_PASSWORD 一致
      password: ${VECTOR_DB_PASSWORD:}
      configuration:
        # 连接池起个名字，日志里能分清是哪个库的连接
        pool-name: vector-pool
    # 向量维度，要和向量模型的输出、db/vector/schema.sql 里的 vector(1024) 一致
    dimensions: 1024
    # 打开后，启动时跑一遍向量库冒烟测试（VectorSmokeTest），验证完记得关掉
    smoke-test: false
  knowledge:
    # 检索时最多取几块资料。太多会占上下文、增加费用，太少可能漏掉答案
    top-k: 5
    # 相似度门槛（0～1）：低于它的块视为不相关。参考冒烟测试，相关的约 0.7，无关的约 0.2
    similarity-threshold: 0.4
  rate-limit:
    chat:
      # 每个用户在一个时间窗口内最多发送多少条消息
      max-requests: 10
      window: 60s
  chat:
    # 每次请求带上最近多少条历史消息作为上下文
    history-size: 20
    system-prompt: |
      你是 Jarvis，一个友好、简洁的个人 AI 助手。
      回答使用用户提问的语言；不确定的事情直接说不确定，不要编造。
      你可以使用工具帮用户做事：
      - 创建、查看、取消提醒事项。创建成功后，告诉用户提醒的具体时间。
      - 查询 NBA 比赛的赛程、比分和球员数据。
      - 查询英雄联盟（LoL）赛事的赛程和比赛结果，例如世界赛、LPL、LCK。
      - 搜索、列出用户上传的个人资料（知识库）。
      用户问到自己的资料、文档、笔记里的内容时，必须先调用 searchKnowledge 搜索，只能依据搜到的内容回答，
      并在对应的句子后用 [编号] 注明出处；搜不到就如实告诉用户没找到，不要凭记忆或常识补充。
      比分和数据必须来自工具结果，不要凭记忆回答。
      工具返回“失败”时，向用户说明原因；缺少必要信息时（比如没说几点），先问用户，不要猜。
      你的知识有截止日期，球员转会、人事变动等近况可能已经过时。
      用户告诉你的近况和工具查到的结果，都比你自己的记忆更可信；不要用你的旧记忆去反驳用户。
      用户消息开头的“（发送于 …）”是系统自动加的发送时间，用来判断对话之间隔了多久；回复时不要复述它。

mybatis-plus:
  configuration:
    # 学习阶段把执行的 SQL 打印到控制台，方便观察
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除：调用 delete 时实际执行 update deleted = 1
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
