<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jarvis</title>
    <style>
        :root {
            --bg: #f6f5f1;
            --panel: #ffffff;
            --text: #1f1f1d;
            --muted: #7a776f;
            --line: #e4e1d8;
            --accent: #2f5d50;
            --user-bubble: #2f5d50;
            --user-text: #ffffff;
            --ai-bubble: #ffffff;
            --error: #b3412e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #171816;
                --panel: #20221f;
                --text: #ecebe6;
                --muted: #9a978e;
                --line: #33352f;
                --accent: #7fb9a5;
                --user-bubble: #3c6f61;
                --user-text: #ffffff;
                --ai-bubble: #262824;
                --error: #e07a63;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
        }
        /* ---------- 左侧会话栏 ---------- */
        aside {
            width: 260px;
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
        }
        .aside-head { padding: 14px; border-bottom: 1px solid var(--line); }
        .aside-head button { width: 100%; }
        #conv-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
        #conv-list li {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #conv-list li:hover { background: var(--bg); }
        #conv-list li.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
        #conv-list .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #conv-list .ops { display: none; gap: 2px; }
        #conv-list li:hover .ops, #conv-list li.active .ops { display: flex; }
        #conv-list .ops button { border: none; padding: 2px 6px; color: var(--muted); font-size: 13px; }
        #conv-list .ops button:hover { color: var(--text); }
        #conv-list input {
            flex: 1; min-width: 0; font: inherit; color: var(--text);
            background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px;
        }
        .conv-empty { color: var(--muted); font-size: 13px; padding: 10px; }
        .aside-foot {
            border-top: 1px solid var(--line);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
        }
        #user-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #logout { padding: 4px 10px; font-size: 13px; }
        /* ---------- 右侧聊天区 ---------- */
        .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        #toggle-aside { display: none; }
        @media (max-width: 720px) {
            aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
            aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
            #toggle-aside { display: inline-block; }
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
        }
        .brand h1 { font-size: 17px; margin: 0; letter-spacing: 0.5px; }
        .brand span { color: var(--muted); font-size: 13px; }
        button {
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text);
            padding: 7px 14px;
        }
        button:hover { border-color: var(--accent); }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
        }
        .messages {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .empty {
            text-align: center;
            color: var(--muted);
            margin-top: 18vh;
            line-height: 1.8;
        }
        .msg { display: flex; flex-direction: column; max-width: 85%; }
        .msg.user { align-self: flex-end; align-items: flex-end; }
        .msg.assistant { align-self: flex-start; }
        .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
        .assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
        .assistant.error .bubble { color: var(--error); }
        .meta { font-size: 12px; color: var(--muted); margin-top: 4px; padding: 0 4px; }
        .cursor::after {
            content: "▍";
            color: var(--accent);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        footer {
            border-top: 1px solid var(--line);
            background: var(--panel);
            padding: 12px 16px 16px;
        }
        form {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            resize: none;
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            max-height: 180px;
            line-height: 1.5;
        }
        textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
        #send { background: var(--accent); color: #fff; border-color: var(--accent); padding: 10px 18px; }
        #send:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
<aside id="aside">
    <div class="aside-head"><button id="new-chat" type="button">＋ 新对话</button></div>
    <ul id="conv-list"></ul>
    <div class="aside-foot">
        <span id="user-name"></span>
        <button id="logout" type="button">退出</button>
    </div>
</aside>

<div class="chat">
<header>
    <div class="brand">
        <button id="toggle-aside" type="button">☰</button>
        <div class="dot"></div>
        <h1>JARVIS</h1>
        <span id="conv-label">新对话</span>
    </div>
</header>

<main id="scroller">
    <div class="messages" id="messages">
        <div class="empty" id="empty">你好，我是 Jarvis。<br>有什么可以帮你的？</div>
    </div>
</main>

<footer>
    <form id="form">
        <textarea id="input" rows="1" placeholder="输入消息…" autofocus></textarea>
        <button id="send" type="submit">发送</button>
    </form>
    <div class="hint">Enter 发送，Shift + Enter 换行</div>
</footer>
</div>

<script>
    // ---------------- 登录状态 ----------------
    // token 存在 localStorage：刷新页面、关闭浏览器后依然保持登录
    const token = localStorage.getItem('jarvis_token');
    if (!token) location.replace('/login.html');

    function logout() {
        localStorage.removeItem('jarvis_token');
        localStorage.removeItem('jarvis_user');
        location.replace('/login.html');
    }

    /** 所有接口请求都走这里：自动带上 token；收到 401 说明 token 失效，回到登录页 */
    async function api(url, options = {}) {
        const headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
        const resp = await fetch(url, { ...options, headers });
        if (resp.status === 401) {
            logout();
            throw new Error('登录已过期');
        }
        return resp;
    }

    const messagesEl = document.getElementById('messages');
    const scroller = document.getElementById('scroller');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const convLabel = document.getElementById('conv-label');

    const convList = document.getElementById('conv-list');
    const aside = document.getElementById('aside');
    const EMPTY_HTML = '<div class="empty" id="empty">你好，我是 Jarvis。<br>有什么可以帮你的？</div>';

    // 当前会话 id：第一次发消息时为空，由后端的 meta 事件告诉我们
    let conversationId = null;
    let conversations = [];
    let busy = false;

    // ---------------- 会话列表 ----------------

    async function loadConversations() {
        const resp = await api('/api/conversations');
        if (!resp.ok) return;
        conversations = await resp.json();
        renderConversations();
    }

    function renderConversations() {
        convList.innerHTML = '';
        if (!conversations.length) {
            convList.innerHTML = '<div class="conv-empty">还没有会话</div>';
            return;
        }
        for (const c of conversations) {
            const li = document.createElement('li');
            li.className = c.id === conversationId ? 'active' : '';
            li.title = c.title;

            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = c.title;

            const ops = document.createElement('span');
            ops.className = 'ops';
            const renameBtn = document.createElement('button');
            renameBtn.type = 'button';
            renameBtn.textContent = '✎';
            renameBtn.title = '重命名';
            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.textContent = '✕';
            deleteBtn.title = '删除';
            ops.append(renameBtn, deleteBtn);

            li.append(title, ops);
            li.addEventListener('click', () => openConversation(c));
            renameBtn.addEventListener('click', (e) => { e.stopPropagation(); startRename(li, c); });
            deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteConversation(c); });
            convList.appendChild(li);
        }
    }

    async function openConversation(c) {
        if (busy) return;
        aside.classList.remove('open');
        const resp = await api('/api/conversations/' + c.id + '/messages');
        if (!resp.ok) { await loadConversations(); return; }
        const messages = await resp.json();

        conversationId = c.id;
        convLabel.textContent = c.title;
        messagesEl.innerHTML = messages.length ? '' : EMPTY_HTML;
        for (const m of messages) {
            if (m.role === 'user' || m.role === 'assistant') addMessage(m.role, m.content);
        }
        renderConversations();
        input.focus();
    }

    /** 把标题换成输入框，回车保存，Esc 取消 */
    function startRename(li, c) {
        const titleEl = li.querySelector('.title');
        const editor = document.createElement('input');
        editor.value = c.title;
        titleEl.replaceWith(editor);
        li.querySelector('.ops').style.display = 'none';
        editor.focus();
        editor.select();
        editor.addEventListener('click', (e) => e.stopPropagation());

        let finished = false;
        const finish = async (save) => {
            if (finished) return;
            finished = true;
            const newTitle = editor.value.trim();
            if (save && newTitle && newTitle !== c.title) {
                await api('/api/conversations/' + c.id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                });
                if (c.id === conversationId) convLabel.textContent = newTitle;
            }
            await loadConversations();
        };
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) finish(true);
            else if (e.key === 'Escape') finish(false);
        });
        editor.addEventListener('blur', () => finish(true));
    }

    async function deleteConversation(c) {
        if (busy || !confirm('删除会话「' + c.title + '」？')) return;
        await api('/api/conversations/' + c.id, { method: 'DELETE' });
        if (c.id === conversationId) newChat();
        await loadConversations();
    }

    function newChat() {
        if (busy) return;
        conversationId = null;
        convLabel.textContent = '新对话';
        messagesEl.innerHTML = EMPTY_HTML;
        renderConversations();
        aside.classList.remove('open');
        input.focus();
    }

    // ---------------- 聊天 ----------------

    /** 在页面上添加一条消息，返回气泡元素，方便流式过程中不断追加文字 */
    function addMessage(role, text) {
        document.getElementById('empty')?.remove();
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        // 用 textContent 而不是 innerHTML：模型输出的内容不会被当成 HTML 执行，防止 XSS
        bubble.textContent = text;
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        scrollToBottom();
        return bubble;
    }

    function addMeta(bubble, text) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = text;
        bubble.parentElement.appendChild(meta);
    }

    function scrollToBottom() {
        scroller.scrollTop = scroller.scrollHeight;
    }

    /**
     * 解析 SSE 文本。一个事件由若干行组成，以空行结束，例如：
     *   event:delta
     *   data:{"text":"你好"}
     *
     * 浏览器自带的 EventSource 只支持 GET 请求，而我们要用 POST 发送消息，
     * 所以这里用 fetch 读取响应流，自己按 SSE 格式拆分事件。
     */
    function parseEvents(buffer) {
        const events = [];
        const blocks = buffer.split(/\r?\n\r?\n/);
        const rest = blocks.pop(); // 最后一块可能还没接收完整，留到下次
        for (const block of blocks) {
            let name = 'message';
            const dataLines = [];
            for (const line of block.split(/\r?\n/)) {
                if (line.startsWith('event:')) name = line.slice(6).trim();
                else if (line.startsWith('data:')) dataLines.push(line.slice(5));
            }
            if (dataLines.length) events.push({ name, data: JSON.parse(dataLines.join('\n')) });
        }
        return { events, rest };
    }

    async function send(text) {
        busy = true;
        sendBtn.disabled = true;
        addMessage('user', text);
        const bubble = addMessage('assistant', '');
        bubble.classList.add('cursor');

        try {
            const resp = await api('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conversationId, message: text })
            });
            if (!resp.ok) throw new Error('请求失败（HTTP ' + resp.status + '）');

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const parsed = parseEvents(buffer);
                buffer = parsed.rest;

                for (const ev of parsed.events) {
                    if (ev.name === 'meta') {
                        conversationId = ev.data.conversationId;
                    } else if (ev.name === 'delta') {
                        bubble.textContent += ev.data.text;
                        scrollToBottom();
                    } else if (ev.name === 'done') {
                        const d = ev.data;
                        const parts = [];
                        if (d.model) parts.push(d.model);
                        if (d.promptTokens != null) parts.push('输入 ' + d.promptTokens + ' / 输出 ' + d.completionTokens + ' tokens');
                        if (parts.length) addMeta(bubble, parts.join(' · '));
                    } else if (ev.name === 'error') {
                        bubble.parentElement.classList.add('error');
                        bubble.textContent = ev.data.message;
                    }
                }
            }
        } catch (err) {
            bubble.parentElement.classList.add('error');
            bubble.textContent = err.message || '网络错误';
        } finally {
            bubble.classList.remove('cursor');
            busy = false;
            sendBtn.disabled = false;
            input.focus();
            // 新会话出现在列表里，聊过的会话排到最前面
            await loadConversations();
            const current = conversations.find(c => c.id === conversationId);
            if (current) convLabel.textContent = current.title;
        }
    }

    document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;
        input.value = '';
        autoResize();
        send(text);
    });

    input.addEventListener('keydown', (e) => {
        // isComposing：中文输入法选字时按 Enter 不应该发送
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            document.getElementById('form').requestSubmit();
        }
    });

    function autoResize() {
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
    }
    input.addEventListener('input', autoResize);

    document.getElementById('new-chat').addEventListener('click', newChat);
    document.getElementById('toggle-aside').addEventListener('click', () => aside.classList.toggle('open'));

    document.getElementById('logout').addEventListener('click', logout);

    // 显示当前用户；同时验证 token 是否仍然有效（无效时 api() 会跳回登录页）
    async function loadMe() {
        const resp = await api('/api/auth/me');
        if (resp.ok) {
            const user = await resp.json();
            document.getElementById('user-name').textContent = user.nickname || user.username;
        }
    }

    if (token) {
        // token 失效时 api() 会跳转登录页并抛出异常，这里忽略即可
        loadMe().catch(() => {});
        loadConversations().catch(() => {});
    }
</script>
</body>
</html>
